<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投資總覽</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HK">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="https://pv7999u7-prog.github.io/invest-dashboard/icon-v3-180.png">
<link rel="icon" href="icon-v3-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: light;
  --page: #f2f2f7;
  --card: #ffffff;
  --card-2: #f7f7f9;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --sep: rgba(60,60,67,0.14);
  --border: rgba(11,11,11,0.08);
  --tint: #2a78d6;
  --tint-wash: #e8f0fb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --area: rgba(42,120,214,0.14);
  --pos: #2a78d6; --neg: #e34948;
  --good-text: #006300; --bad-text: #b42323;
  --tabbar: rgba(249,249,249,0.86);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #000000; --card: #1a1a19; --card-2: #242423;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #484845; --sep: rgba(84,84,88,0.5); --border: rgba(255,255,255,0.08);
    --tint: #3987e5; --tint-wash: #16263a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --area: rgba(57,135,229,0.22);
    --pos: #3987e5; --neg: #e66767;
    --good-text: #0ca30c; --bad-text: #e66767;
    --tabbar: rgba(22,22,22,0.86);
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--page); }
body {
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  background: color-mix(in srgb, var(--page) 86%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  display: flex; align-items: center; gap: 8px; min-height: 44px;
}
.topbar .back { color: var(--tint); font-size: 17px; display: none; align-items: center; gap: 2px; }
.topbar .back.show { display: inline-flex; }
.topbar .spacer { flex: 1; }
.status { font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }
.status.ok .dot { background: #0ca30c; }
.status.busy .dot { background: var(--tint); animation: pulse 1s infinite; }
.status.err .dot { background: #d03b3b; }
@keyframes pulse { 50% { opacity: .3; } }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--tint); }
.iconbtn:active { background: var(--tint-wash); }
.iconbtn svg { width: 21px; height: 21px; }

main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.title { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 14px; }

/* ---------- cards ---------- */
.card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card h3 { margin: 0 0 2px; font-size: 16px; font-weight: 650; }
.card .cap { font-size: 13px; color: var(--text-secondary); margin: 0 0 12px; }
.sec { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin: 22px 4px 8px; }

.hero { background: linear-gradient(160deg, var(--tint-wash), var(--card) 70%); }
.hero .lbl { font-size: 13px; color: var(--text-secondary); }
.hero .big { font-size: 38px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.hero .meta { font-size: 14px; color: var(--text-secondary); }
.pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.pill.up { background: color-mix(in srgb, var(--good-text) 12%, transparent); color: var(--good-text); }
.pill.down { background: color-mix(in srgb, var(--bad-text) 12%, transparent); color: var(--bad-text); }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
@media (min-width: 640px) { .tiles.t4 { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.tile { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .k { font-size: 12.5px; color: var(--text-secondary); }
.tile .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.up { color: var(--good-text); }
.down { color: var(--bad-text); }

/* ---------- lists ---------- */
.list { background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 14px; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); }
.row .main { flex: 1; min-width: 0; }
.row .t1 { font-size: 16px; font-weight: 550; }
.row .t2 { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; }
.row .r .t1 { font-weight: 600; }
.row .r .t2 { font-weight: 600; }
.row.link { cursor: pointer; }
.row.link:active { background: var(--card-2); }
.chev { color: var(--text-muted); font-size: 18px; margin-left: -4px; }
.badge { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 16px; flex: none; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14.5px; border-top: 1px solid var(--sep); }
.kv:first-of-type { border-top: 0; }
.kv span:first-child { color: var(--text-secondary); }
.kv span:last-child { font-weight: 550; font-variant-numeric: tabular-nums; text-align: right; }

/* ---------- segmented ---------- */
.seg { display: flex; background: var(--card-2); border-radius: 9px; padding: 2px; gap: 2px; margin-bottom: 12px; }
.seg button { flex: 1; font-size: 13px; padding: 6px 4px; border-radius: 7px; color: var(--text-secondary); }
.seg button.on { background: var(--card); color: var(--text-primary); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: inherit; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.ln { height: 2px; width: 14px; vertical-align: 3px; }
.tip {
  position: absolute; pointer-events: none; background: var(--card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; font-size: 12.5px;
  box-shadow: 0 6px 24px rgba(0,0,0,.16); white-space: nowrap; opacity: 0; transition: opacity .1s; z-index: 5;
}
.tip b { font-weight: 650; display: block; margin-bottom: 2px; }
.tip .tr { display: flex; justify-content: space-between; gap: 14px; }
.tip .tr span:first-child { color: var(--text-secondary); }
.stack { display: flex; height: 26px; gap: 2px; border-radius: 7px; overflow: hidden; margin-bottom: 4px; }
.stack div { height: 100%; }

/* ---------- timeline ---------- */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--grid); }
.tl li { position: relative; padding: 0 0 14px 26px; }
.tl li::before { content: ""; position: absolute; left: 1px; top: 5px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--tint); background: var(--card); }
.tl .d { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.tl .x { font-size: 14.5px; }

/* ---------- forms ---------- */
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.field input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--sep); background: var(--card-2); color: var(--text-primary); font-size: 16px; }
.btn { display: block; width: 100%; text-align: center; padding: 12px; border-radius: 12px; background: var(--tint); color: #fff; font-weight: 600; font-size: 16px; }
.btn.ghost { background: var(--card-2); color: var(--bad-text); margin-top: 10px; }
.msg { font-size: 13.5px; color: var(--text-secondary); }
.msg.err { color: var(--bad-text); }
.steps { margin: 0; padding-left: 20px; font-size: 14px; color: var(--text-secondary); }
.steps li { margin: 4px 0; }
.empty { text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 14px; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--tabbar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--sep);
  display: flex; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--text-muted); padding: 2px 0; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--tint); }
.masked { letter-spacing: .1em; }

/* ---------- 下拉更新 ---------- */
main { transition: transform .25s ease; }
main.pulling { transition: none; }
.ptr {
  position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 56px); z-index: 15;
  display: flex; justify-content: center; pointer-events: none; opacity: 0; transition: opacity .2s ease;
}
.ptr .ring { width: 36px; height: 36px; border-radius: 50%; background: var(--card); box-shadow: 0 2px 10px rgba(0,0,0,.14);
  display: grid; place-items: center; color: var(--tint); }
.ptr svg { width: 20px; height: 20px; transition: transform .2s ease; }
.ptr.spin svg { animation: ptrspin .8s linear infinite; }
@keyframes ptrspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="topbar">
  <button class="back" id="back" aria-label="返回">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span id="backLabel">更多</span>
  </button>
  <span class="spacer"></span>
  <span class="status" id="status"><span class="dot"></span><span id="statusText"></span></span>
  <button class="iconbtn" id="eye" aria-label="隱藏金額"></button>
  <button class="iconbtn" id="refresh" aria-label="重新整理">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
  </button>
</div>

<div class="ptr" id="ptr"><div class="ring">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
</div></div>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>總覽</button>
  <button data-tab="us"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>美股</button>
  <button data-tab="tw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/></svg>台股</button>
  <button data-tab="crypto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 7.5h4a2.2 2.2 0 0 1 0 4.5h-4zm0 4.5h4.6a2.2 2.2 0 0 1 0 4.5H9.5zM9.5 6v12M11.5 6v1.5M11.5 16.5V18"/></svg>加密貨幣</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>更多</button>
</nav>

<script src="lock.js"></script>
<script src="app.js"></script>
</body>
</html>
